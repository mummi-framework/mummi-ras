models:
  generative:
    database: # Where we store pre-computed structures
      paths:
      - /lustre/orion/lrn005/proj-shared/mummi-root-c3/test-c3-newucgfb/round2-pre-generated-c3-1000.npz
    v2ucg: # MuMMI will pick the first valid path
      paths:
      - /p/vast1/mummiusr/mummi_large_resources/main_campaign3/ml/generative/v2ucg/BCR1/epoch=99-step=1000000.ckpt
      - /lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign3/ml/generative/v2ucg/BCR1/epoch=99-step=1000000.ckpt
    ucg2cg:
      paths:
      - /p/vast1/mummiusr/mummi_large_resources/main_campaign3/ml/generative/ucg2cg/BCR1/epoch=99-step=1000000.ckpt
      - /lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign3/ml/generative/ucg2cg/BCR1/epoch=99-step=1000000.ckpt
    resources: mummi_ras.Naming.dir_res('generative-indices') # Correspond to a naming convention in mummi-core so we can fetch the file automatically from mummi_resources
    outpath: mummi_ras.Naming.dir_root('ml') # Where to output structures

  autoencoder:
    model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2024-08-18-20-27-45_h011389" # round 3
    paths:
    - "/p/vast1/mummiusr/mummi_large_resources/main_campaign2/" # LC
    - "/lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign2" # ORNL
    outpath: mummi_ras.Naming.dir_root('ml') # Where to output structures

  ucg_autoencoder:
    model: model-protein_latent_space-initial_reconstruction_new5-c3_z20-t2025-06-16-15-00-42_h352533
    paths:
    - /p/vast1/mummiusr/mummi_large_resources/main_campaign3/ucg_ls/
    - /lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign3/ucg_ls/
    resources: mummi_ras.Naming.dir_res('ucg-autoencoder')

sampler:
  interpolator: "ot_feedback" # Type of sampler used. Can be "naive", "ot" or "ot_feedback"
   # Pickle file of pre-computed interpolator (will override most settings here if chosen)
  outpath: mummi_ras.Naming.dir_root('ml')
  feedback:
    do_feedback: true
    database: "db-feedback-sampling.npz" # The feedback database used for sampling (createsims status and validation)
    frame_database: "db-feedback-frames.npz" # The feedback database used for sampling  (feedback frames from cganalysis)
  # This factor defines the number of extra structures we will generate
  # Example: if =2, we will select <= 2 * nMaxSelectedPatchBuffer structures
  # It is useful when many createsims are failing and we need to generate more
  factor_extra_structures: 1
  # Number of neighbors (used to calculate the k nearest neighbors)
  kneighbors: 10
  # Define lower bound for paramter lambda that will define how far from training data we are sampling
  lambda_lowerbound: 0
  # Define upper bound for parameter lambda
  lambda_upperbound: 1
  # Define the number of iterations used by the optimal transport package
  num_iter_max: 1000000
  # This parameter defines the fraction of A and B that will actually be used (0.1 = 10%)
  sub_sample_frac: 0.04

generator:
  outpath: mummi_ras.Naming.dir_root('ml')

validator:
  healing: true # perform healing on the validated structures
  cleanup: true # Remove all the temporary files generated during validations
  nthreads: 50   # Number of threads to use for the validations
  outpath: mummi_ras.Naming.dir_root('ml')
  # Name of the folder in the mummi_resources to pull out
  resources: "martini3-validator"
  # complex: "ras-raf-14-3-3-ref-CG.gro" # C2
  complex: "dimer.gro" # c3
