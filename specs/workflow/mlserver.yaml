# This file describes the options that can be used for the MuMMI ML server

config:
  jobname:       "mlserver"
  log_mem_usage: 0
  loglevel:      2       # When stable, change to 2 (debug is 1)
  logpath:       ''      # empty logpath will use ROOT/workspace
  logfile:       0       # whether to write log to file
  logstdout:     1       # whether to write log to stdout

  mini_mummi:    false    # Run with mini MuMMI settings

  lockfile:  # Lockfile ensuring that multiple jobs can update the same DBs/File
    path: mummi_ras.Naming.dir_root('workspace')
    name: "mummidb.lock"

workspace:
  path: mummi_ras.Naming.dir_root('mlserver')
  # The file where the credentials are stored
  credentials: "rabbitmq-credentials.json"
  # The file where the TLS certificate is stored
  certificate: "rabbitmq-credentials.cacert"

# Broker (for example RabbitMQ) parameters
broker:
  interface:   "rabbitmq"
  queue:       "mummi_queue"

# Auto-encoder (ML model) parameters
encoder:
  # # PC3
  # path: "/p/vast1/mummiusr/mummi_large_resources/"
  # # C1
  # path: "/p/vast1/mummiusr/mummi_large_resources/main_campaign1"
  # # C2 LC
  # path: "/p/vast1/mummiusr/mummi_large_resources/main_campaign2"
  # C2 ORNL
  # path: "/lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign2"
  path: 
  - "/p/vast1/mummiusr/mummi_large_resources/main_campaign2/" # GPFS
  - "/lustre/orion/lrn005/proj-shared/training-data/mummi_large_resources/main_campaign2" # ORNL
  # # PC3 pre-round 0
  # model: "model-protein_latent_space-initial_reconstruction_new5-c17581_z32-t2023-03-07-10-51-45_h549204"
  # # PC3 round 0
  # model: "model-protein_latent_space-initial_reconstruction_new5-c17581_z32-t2023-04-08-08-20-33_h907109"
  # # PC3 round 1
  # model: "model-protein_latent_space-initial_reconstruction_new5-c17581_z32-t2023-05-15-06-16-50_h565888"
  # # Campaign 1 (C1): round 0
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2023-11-17-17-15-11_h537713"
  # # Campaign 1 (C1): round 1
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2023-11-30-21-19-21_h826598"
  # # Campaign 1 (C1): round 2
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2023-12-06-21-33-23_h561680"
  
  # Campaign 2 (C2): Dense (KS)
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2024-04-24-11-36-27_h319047"
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2024-05-09-00-15-35_h953835"
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2024-05-23-14-54-36_h818757" # round 1
  # model: "model-protein_latent_space-initial_reconstruction_new5-c8691_z32-t2024-06-21-05-46-42_h741218" #round 2
