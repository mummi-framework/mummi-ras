# settings for wfmanager
wfmanager:
  env:

  config:
    # --------------------------------------------------------------------------
    # different run modes
    is_gc: 1
    do_patchcreation:    0
    do_workflow:         1
    do_schedulejobs:     1

    # if 1 wfmanager will contact  ML server which should be running
    do_mlserver:         1
    # The round ID that will serve to create ml/iter{mlserver_round_id}/ to store ML generated patches
    mlserver_round_id:   0

    # if 1 wfmanager will contact  UCG server which should be running (note that if ML server is on, UCG cannot be used and vice versa)
    do_ucgserver:        0
    # The round ID that will serve to create ucg/iter{ucgserver_round_id}/ to store UCG generated patches
    ucgserver_round_id:  0

    do_patchselection:   0
    do_feedback_cg2mc:   0

    do_cgselection:      0
    do_feedback_aa2cg:   0

    #do_cold_restart:    0
    #do_recovery:        ''

    # --------------------------------------------------------------------------
    # what type of file system to use (valid values: 'simple' / 'taridx / dbr / mummi')
    iotype:           mummi
    fbtype:           mummi

    # --------------------------------------------------------------------------
    # resource description - relative aa to cg portion - csim will be backmapping vs createsims - cg is aa_analysis vs cg_analysis
    portion_csim:         0.5 # 0.5 # 0.5, 0.03 #.8 # 0.6    # 0.8 -- after a day of running
    # portion_cg:           1.0 #.8  # 0.8    # 0.8
    portion_cg:           0.5 # 0.5 # 0.5, 0.97

    # --------------------------------------------------------------------------
    # feedback parameters
    fbcg_do_wts:          1  # use weight for cg to macro feedback

    fbaa_hvr_th:          0.25   #TODO: check if Fikret wants to change these!
    fbaa_crd_th:          0.2    #0.1975  # Suggested range 0.2-0.3
    fbaa_frame_increment: 25000  #2000  #50000 -- 2000 is a test value to accelerate fb

    # --------------------------------------------------------------------------
    # number of seconds per iteration for Patch Creator (nSecPerIterPC) and for the general workflow (nSecPerIterWF)
    # if a loop finished sooner, it will wait to match the frequency
    nSecPerIterPC:        5   #30 # Once initial data consumed, try to match output of macro model
    nSecPerIterWF:        15   #15 Number of seconds we wait after each WF iteration

    nSecPerCgSelUpdate:   30 # 500 nodes this is ok but should be reduesed for 100 i.e. go to 60

    # TODO: should match with the reload_freq in macro code
    nSecPerMacroFeedback: 600
    nSecPerCGFeedback:    600

    # --------------------------------------------------------------------------
    # how much max work to do per iteration
    nReadPatchesPerIter:            4     # this is  patches per GC
                                          # 3300    #990  # number of macro patches to be read
    nReadCGFramesPerIter:           200   # number of CG patches to be added per run  # NOT USED
    nMaxCGFramesSelectionsPerIter:  50    #50  # max number of CG frames to be selected per iter
    nMaxJobsPerIter:                800   #7000  #1200  #400, 200  # max number of jobs to schedule per iter (including when restoring checkpoints!)

    nMaxSelectedCGFrameBuffer:    400   # 280  # 500nodes, 100

    # Important for ML server
    nMaxPatchesSelectionsPerIter:   10    #100 # max number of structures generated by ML server to be selected per iter
    # to prevent building a stale patch selection, slow down patch selection
    # should roughly be the same as the number of resources for each
    nMaxSelectedPatchBuffer:       2000      #40000   # Max number of total structure selected. This is also the max number of creatsims at any given time  # 60,  420 # 500nodes, 200   # We will scale this up at scale (near the end)

    # --------------------------------------------------------------------------
    jobname:     "wfmanager"
    workspace:   ''     # to be read from config.yaml

    log_mem_usage: 0
    loglevel:   2       # When stable, change to 2 (debug is 1)
    logpath:    ''      # empty logpath will use SPLASH_ROOT/workspace

    logfile:    1       # whether to write log to file
    logstdout:  0       # whether to write log to stdout
                            # not a good idea to use both!
# ------------------------------------------------------------------------------
