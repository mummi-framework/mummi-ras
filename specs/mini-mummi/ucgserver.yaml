# This file describes the options that can be used for the MuMMI ML server

config:
  jobname:       "ucgserver"
  log_mem_usage: 1       # 0 deactivate the memory logging (logging memory is slow)
  loglevel:      2       # When stable, change to 2 (debug is 1)
  logpath:       ''      # empty logpath will use ROOT/workspace
  logfile:       0       # whether to write log to file
  logstdout:     1       # whether to write log to stdout

workspace:
  path:
    eval: mummi_ras.Naming.dir_root('ucgserver')
  # The file where the credentials are stored
  credentials: "rabbitmq-credentials.json"
  # The file where the TLS certificate is stored
  certificate: "rabbitmq-credentials.cacert"

# Broker (for example RabbitMQ) parameters
broker:
  interface:   'rabbitmq'
  queue:       'mummi_ucg'

# Auto-encoder (ML model) parameters
# Change the path to point to the PATH where your ML resides
encoder:
  path: ""
  model: ""

generator:
  outpath:
    eval: mummi_ras.Naming.dir_root('ucg')
  trajectories: "ucg_trajectories.txt"

validator:
  healing: true # perform healing on the validated structures
  cleanup: true # Remove all the temporary files generated during validations
  outpath:
    eval: mummi_ras.Naming.dir_root('ml')
  # Name of the folder in the mummi_resources to pull out
  resources: "martini3-validator"
  complex: "ras-rbdcrd-ref-CG.gro"